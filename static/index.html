<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local RAG — ask questions about documents using AI" />
    <title>LocalRAG</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-orb"></div>
                <span class="brand-name">LocalRAG</span>
            </div>
            <button class="new-chat-btn" id="newChatBtn" title="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="sidebar-doc" id="sidebarDoc">
            <span class="doc-label">No document loaded</span>
        </div>
        <div class="sidebar-history" id="sidebarHistory"></div>
        <div class="sidebar-bottom">
            <div class="sidebar-info">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>100% Local &amp; Private</span>
            </div>
        </div>
    </aside>

    <!-- Sidebar toggle (mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <!-- Main Area -->
    <main class="main" id="main">
        <!-- Chat messages -->
        <div class="chat-area" id="chatArea">
            <!-- Landing / Upload -->
            <div class="landing" id="landing">
                <div class="landing-logo">
                    <div class="landing-orb"></div>
                </div>
                <h1 class="landing-title">LocalRAG</h1>
                <p class="landing-sub">Upload a PDF to start asking questions</p>
                <div class="upload-card" id="uploadCard">
                    <svg class="upload-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <div class="upload-text">
                        <span class="upload-main">Drag &amp; drop your PDF here</span>
                        <span class="upload-alt">or click to browse</span>
                    </div>
                    <input type="file" id="fileInput" accept=".pdf" hidden />
                </div>
                <div class="upload-status" id="uploadStatus"></div>
            </div>
        </div>

        <!-- Input bar (pinned to bottom) -->
        <div class="input-wrapper" id="inputWrapper">
            <form class="input-bar" id="queryForm">
                <textarea
                    id="questionInput"
                    class="input-field"
                    placeholder="Message LocalRAG…"
                    rows="1"
                    required
                ></textarea>
                <button type="submit" class="send-btn" id="sendBtn" title="Send" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </form>
            <p class="input-hint">LocalRAG uses your local Ollama model. Responses are based on your uploaded document.</p>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
